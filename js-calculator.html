<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Calculator</title>
    <!-- En Güncel Bootstrap 5.3.3 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .calculator {
            max-width: 360px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-radius: 16px;
            overflow: hidden;
        }
        .display {
            background-color: #212529;
            color: #fff;
            font-size: 2.5rem;
            text-align: right;
            padding: 20px;
            word-wrap: break-word;
            word-break: break-all;
            min-height: 100px;
        }
        .btn-calc {
            font-size: 1.5rem;
            height: 70px;
            border-radius: 0;
            border: 1px solid #dee2e6;
        }
        .btn-calc:active {
            filter: brightness(0.9);
        }
    </style>
</head>
<body>

<div class="calculator bg-white">
    <!-- Ekran -->
    <div id="display" class="display">0</div>
    
    <!-- Tuş Takımı -->
    <div class="row g-0">
        <div class="col-3"><button class="btn btn-light w-100 btn-calc text-danger font-weight-bold" onclick="clearDisplay()">C</button></div>
        <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendValue('(')">(</button></div>
        <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="appendValue(')')">)</button></div>
        <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="appendValue('/')">/</button></div>
    </div>
    <div class="row g-0">
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('7')">7</button></div>
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('8')">8</button></div>
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('9')">9</button></div>
        <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="appendValue('*')">×</button></div>
    </div>
    <div class="row g-0">
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('4')">4</button></div>
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('5')">5</button></div>
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('6')">6</button></div>
        <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="appendValue('-')">-</button></div>
    </div>
    <div class="row g-0">
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('1')">1</button></div>
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('2')">2</button></div>
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('3')">3</button></div>
        <div class="col-3"><button class="btn btn-warning w-100 btn-calc" onclick="appendValue('+')">+</button></div>
    </div>
    <div class="row g-0">
        <div class="col-3"><button class="btn btn-light w-100 btn-calc" onclick="backspace()">⌫</button></div>
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('0')">0</button></div>
        <div class="col-3"><button class="btn btn-outline-secondary btn-light w-100 btn-calc" onclick="appendValue('.')">.</button></div>
        <div class="col-3"><button class="btn btn-success w-100 btn-calc" onclick="calculate()">=</button></div>
    </div>
</div>

<!-- JavaScript Mantığı -->
<script>
    let display = document.getElementById('display');
    let currentInput = '';

    function appendValue(val) {
        if (display.innerText === '0' && !isNaN(val)) {
            currentInput = val;
        } else {
            currentInput += val;
        }
        updateDisplay();
    }

    function clearDisplay() {
        currentInput = '0';
        updateDisplay();
    }

    function backspace() {
        if (currentInput.length > 1) {
            currentInput = currentInput.slice(0, -1);
        } else {
            currentInput = '0';
        }
        updateDisplay();
    }

    function updateDisplay() {
        display.innerText = currentInput || '0';
    }

    function calculate() {
        try {
            // Güvenli eval yerine geçebilecek basit bir matematiksel hesaplama
            let result = eval(currentInput);
            currentInput = String(result);
            updateDisplay();
        } catch (error) {
            display.innerText = 'Hata';
            currentInput = '';
        }
    }
</script>

</body>
</html>
